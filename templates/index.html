<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bean Data Augmentation Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">🌱 ระบบเพิ่มข้อมูลรูปภาพถั่ว (Data Augmentation)</h2>
        <div class="card p-4 shadow-sm mb-4">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="beanImage" class="form-label">อัปโหลดรูปถั่วต้นแบบ (1 รูป):</label>
                    <input class="form-control" type="file" id="beanImage" name="file" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-success">สร้างรูป Augmentation ชุดใหม่</button>
            </form>
        </div>

        <div id="resultSection" style="display: none;" class="card p-4 shadow-sm">
            <h4>ผลลัพธ์การแปลงรูปภาพ</h4>
            <p id="statusMsg" class="text-muted"></p>
            <div class="row" id="imagePreviewContainer"></div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById('beanImage');
            formData.append('file', fileInput.files[0]);

            const response = await fetch('/augment', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('resultSection').style.display = 'block';
                document.getElementById('statusMsg').innerText = data.message;
                
                const container = document.getElementById('imagePreviewContainer');
                container.innerHTML = '';
                data.images.forEach(imgUrl => {
                    const col = document.createElement('div');
                    col.className = 'col-md-3 mb-3';
                    col.innerHTML = `<div class="card h-100"><img src="${imgUrl}" class="card-img-top p-2" style="height: 150px; object-fit: contain;"><div class="card-body p-2"><small class="text-muted">${imgUrl.split('/').pop()}</small></div></div>`;
                    container.appendChild(col);
                });
            }
        });
    </script>
</body>
</html>
